name: Deploy Projects to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            project3/package-lock.json
            project4/package-lock.json
            project5/package-lock.json
            project6/package-lock.json
            project7/package-lock.json
            project8/package-lock.json
            project9/package-lock.json
            project10/package-lock.json

      - name: Build Project 3
        working-directory: project3
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project3/

      - name: Build Project 4
        working-directory: project4
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project4/

      - name: Build Project 5
        working-directory: project5
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project5/

      - name: Build Project 6
        working-directory: project6
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project6/

      - name: Build Project 7
        working-directory: project7
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project7/

      - name: Build Project 8
        working-directory: project8
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project8/

      - name: Build Project 9
        working-directory: project9
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project9/

      - name: Build Project 10
        working-directory: project10
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          npm run build -- --base=/Web-Interface-Projects/project10/

      - name: Prepare website
        run: |
          mkdir -p public/project3
          mkdir -p public/project4
          mkdir -p public/project5
          mkdir -p public/project6
          mkdir -p public/project7
          mkdir -p public/project8
          mkdir -p public/project9
          mkdir -p public/project10

          cp index.html public/
          cp style.css public/
          cp project1.html public/
          cp project2.html public/

          cp -r project3/dist/* public/project3/
          cp -r project4/dist/* public/project4/
          cp -r project5/dist/* public/project5/
          cp -r project6/dist/* public/project6/
          cp -r project7/dist/* public/project7/
          cp -r project8/dist/* public/project8/
          cp -r project9/dist/* public/project9/
          cp -r project10/dist/* public/project10/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4