name: Deploy Projects to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Project 3
  run: |
    cd project3
    npm install
    npm run build -- --base=/Web-Interface-Projects/project3/

      - name: Build Project 4
        run: |
          cd project4
          npm install
          npm run build -- --base=/Web-Interface-Projects/project4/
      
      - name: Build Project 5
        run: |
          cd project5
          npm install
          npm run build -- --base=/Web-Interface-Projects/project5/
      
      - name: Build Project 6
        run: |
          cd project6
          npm install
          npm run build -- --base=/Web-Interface-Projects/project6/
      
      - name: Build Project 7
        run: |
          cd project7
          npm install
          npm run build -- --base=/Web-Interface-Projects/project7/
      
      - name: Build Project 8
        run: |
          cd project8
          npm install
          npm run build -- --base=/Web-Interface-Projects/project8/
      
      - name: Build Project 9
        run: |
          cd project9
          npm install
          npm run build -- --base=/Web-Interface-Projects/project9/
      
      - name: Build Project 10
        run: |
          cd project10
          npm install
          npm run build -- --base=/Web-Interface-Projects/project10/
      - name: Prepare website
        run: |
          mkdir -p public/project3
          mkdir -p public/project4
          mkdir -p public/project5
          mkdir -p public/project6
          mkdir -p public/project7
          mkdir -p public/project8
          mkdir -p public/project9
          mkdir -p public/project10

          cp index.html public/
          cp style.css public/
          cp project1.html public/
          cp project2.html public/

          cp -r project3/dist/* public/project3/
          cp -r project4/dist/* public/project4/
          cp -r project5/dist/* public/project5/
          cp -r project6/dist/* public/project6/
          cp -r project7/dist/* public/project7/
          cp -r project8/dist/* public/project8/
          cp -r project9/dist/* public/project9/
          cp -r project10/dist/* public/project10/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        